services:
  web:
    build:
      context: .
      args:
        # Same-origin; nginx reverse-proxies /api and /login to API_UPSTREAM
        VITE_API_BASE_URL: /
        # Self-signed cert CN (use VPS IP or hostname)
        SSL_CN: ${SSL_CN:-localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
